name: Build container image

on:
    push:
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.dockerignore'
            - 'Dockerfile'
            - '.github/workflows/build-image.yml'

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: bsky-list-feeds

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.24'
                cache: true

            - name: Login to container registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Get release branch version
              id: release_branch
              if: startsWith(github.ref, 'refs/heads/release')
              env:
                BRANCH: ${{ github.ref_name }}
              run: echo "::set-output name=ver::${BRANCH##*/}"
            
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                tags: |
                  type=semver,pattern={{version}}
                  type=semver,pattern={{major}}.{{minor}}
                  type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                  type=edge
                  type=ref,event=branch,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main')) }}
                  type=ref,event=branch,suffix=-{{sha}},priority=599,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/develop')) }}
                  type=raw,value=${{ steps.release_branch.outputs.ver }}-rc,priority=600,enable=${{ startsWith(github.ref, 'refs/heads/release') }}
            
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                cache-from: type=gha
                cache-to: type=gha,mode=max
                context: .
                push: ${{ github.event_name != 'pull_request' }}
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                annotations: ${{ steps.meta.outputs.annotations }}
                platforms: linux/amd64,linux/arm64