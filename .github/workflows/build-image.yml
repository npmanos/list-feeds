name: Build container image

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/build-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      
      - name: Run Tests
        run: go test -v ./...

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: linux
            arch: amd64
            runner: ubuntu-latest
          - family: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release branch version
        id: release_branch
        if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix')
        env:
          BRANCH: ${{ github.ref_name }}
        # run: echo "::set-output name=ver::${BRANCH##*/}"
        run: echo "ver=${BRANCH##*/}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta-arch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Go Build Cache for Docker
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache
          key: ${{ runner.os }}-${{ runner.arch }}-go-build-cache-${{ hashFiles('**/go.sum') }}
      
      - name: Inject go-build-cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: go-build-cache
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push by digest
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta-arch.outputs.labels }}
          annotations: ${{ steps.meta-arch.outputs.annotations }}
          platforms: ${{ matrix.family }}/${{ matrix.arch }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
      
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker-build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.family }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  
  publish-multiarch:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get release branch version
        id: release_branch
        if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix')
        env:
          BRANCH: ${{ github.ref_name }}
        # run: echo "::set-output name=ver::${BRANCH##*/}"
        run: echo "ver=${BRANCH##*/}" >> $GITHUB_OUTPUT
      
      - name: Docker meta
        id: meta-final
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge
            type=ref,event=branch,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/hotfix')) }}
            type=ref,event=branch,suffix=-{{sha}},priority=599,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/hotfix')) }}
            type=raw,value=${{ steps.release_branch.outputs.ver }}-rc,priority=600,enable=${{ startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix') }}
      
      - name: Create multiarch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta-final.outputs.version }}
