name: Build container image

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/build-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release branch version
        id: release_branch
        if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix')
        env:
          BRANCH: ${{ github.ref_name }}
        # run: echo "::set-output name=ver::${BRANCH##*/}"
        run: echo "ver=${BRANCH##*/}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta-arch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge
            type=ref,event=branch,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/hotfix')) }}
            type=ref,event=branch,suffix=-{{sha}},priority=599,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/develop')) }}
            type=raw,value=${{ steps.release_branch.outputs.ver }}-rc,priority=600,enable=${{ startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arch-specific image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-arch.outputs.tags }}
          labels: ${{ steps.meta-arch.outputs.labels }}
          annotations: ${{ steps.meta-arch.outputs.annotations }}
          platforms: ${{ matrix.platform }}
  
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get release branch version
        id: release_branch
        if: startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix')
        env:
          BRANCH: ${{ github.ref_name }}
        # run: echo "::set-output name=ver::${BRANCH##*/}"
        run: echo "ver=${BRANCH##*/}" >> $GITHUB_OUTPUT
      
      - name: Docker meta
        id: meta-final
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge
            type=ref,event=branch,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/hotfix')) }}
            type=ref,event=branch,suffix=-{{sha}},priority=599,enable=${{ !(startsWith(github.ref, 'refs/heads/release')  || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/hotfix')) }}
            type=raw,value=${{ steps.release_branch.outputs.ver }}-rc,priority=600,enable=${{ startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix') }}
      
      - name: Create and push multi-arch manifest
        run: |
          for tag in ${{ steps.meta-final.outputs.tags }}; do
            docker manifest create "$tag" \
              --amend "${tag}-amd64" \
              --amend "${tag}-arm64"
            docker manifest push "$tag"
          done
